# ================================================
# VacanSee Backend - application.properties
# ================================================

server.port=8000
server.error.include-message=always
server.error.include-binding-errors=always

# MySQL - adjust username/password to match your local setup
spring.datasource.url=jdbc:mysql://localhost:3306/appdevdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# This is needed to serialize LocalDate properly in BookingDTO
spring.jackson.serialization.write-dates-as-timestamps=false

spring.application.name=VacanSee Backend API

logging.level.root=WARN
logging.level.com.vacanSee=DEBUG
logging.level.org.hibernate.SQL=WARN

jwt.secret=VacanSee$$SecretKey$$2024$$Application$$PropertyManagement
jwt.expiration=86400000

# Allow large JSON request bodies (base64 images can be several MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=-1

# Run the schema fix SQL on startup to alter existing column types
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-fix.sql
spring.sql.init.continue-on-error=true
